name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK; Gradle fetches missing platforms itself
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app and Android project
        run: |
          npm run build:web
          npx cap add android
          npm run assets
          npx cap sync android
          # MainActivity that hands Google consent results to the sign-in plugin
          cp ci/native/MainActivity.java android/app/src/main/java/com/funmburg/mingyue/MainActivity.java
          cp ci/native/QuietGooglePlugin.java android/app/src/main/java/com/funmburg/mingyue/
          # reminders: status-bar icon, and exact alarms so a reminder fires on the minute
          cp ci/native/res/drawable/ic_stat_migo.xml android/app/src/main/res/drawable/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Android's own launch screen: blank, in the splash colour
          node scripts/quiet-splash.mjs
          # home-screen widgets: Сегодня, Миго, Быстро добавить
          node scripts/add-widgets.mjs
          # every build gets a higher version, so Android always offers "Update"
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"0.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # One fixed signing key, so a new APK installs over the old one without losing data
      # (Gradle ignores ~/.android/debug.keystore on the runner and made a new key every build, so it is set explicitly)
      - name: Sign with the repo's debug key
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation "com.google.android.gms:play-services-auth:21.4.0"
          }

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file("../ci/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # the APK must carry the fixed key (86:CC...), or updates and Google sign-in break
      - name: Check signing key
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-1 digest: 86ccdbdcf3c71c623e2e0db2dd7ec5db37483103" certs.txt

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/mingyue-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mingyue-apk
          path: out/*.apk
          retention-days: 30

      # Always-current download page: Releases → "Последняя сборка" → the .apk file
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/mingyue.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/mingyue.apk \
            --title "Последняя сборка" \
            --notes "Сборка $(date -u +'%d.%m.%Y %H:%M') UTC, коммит ${GITHUB_SHA::7}. Скачайте mingyue.apk и откройте его на телефоне." \
            --latest

      # Test builds (next or a feature branch, run by hand) go to a separate pre-release, so the main download stays untouched
      - name: Publish to the "test" pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/mingyue-test.apk
          gh release delete test --yes --cleanup-tag || true
          gh release create test out/mingyue-test.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Тестовая сборка" \
            --notes "Тестовая сборка $(date -u +'%d.%m.%Y %H:%M') UTC, коммит ${GITHUB_SHA::7}. Ставится поверх обычной."
