name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK; Gradle fetches missing platforms itself
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app and Android project
        run: |
          npm run build:web
          npx cap add android
          npm run assets
          npx cap sync android

      # One fixed signing key, so a new APK installs over the old one without losing data
      - name: Use the repo's debug key
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/mingyue-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mingyue-apk
          path: out/*.apk
          retention-days: 30

      # Always-current download page: Releases → "Последняя сборка" → the .apk file
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/mingyue.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/mingyue.apk \
            --title "Последняя сборка" \
            --notes "Сборка $(date -u +'%d.%m.%Y %H:%M') UTC, коммит ${GITHUB_SHA::7}. Скачайте mingyue.apk и откройте его на телефоне." \
            --latest
