name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK; Gradle fetches missing platforms itself
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app and Android project
        run: |
          npm run build:web
          npx cap add android
          npm run assets
          npx cap sync android

      # One fixed signing key, so a new APK installs over the old one without losing data
      - name: Use the repo's debug key
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/mingyue-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mingyue-apk
          path: out/*.apk
          retention-days: 30
