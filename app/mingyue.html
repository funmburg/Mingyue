<!-- loading screen (design/splash/splash-embed.html), shown on every start until the planner data is ready -->
<style>
#msplash { position: fixed; inset: 0; z-index: 9999; background: var(--h-surface, #fff); color: var(--h-fg, #111); font-family: var(--h-f-body, "Manrope", system-ui, sans-serif); container-type: size; overflow: hidden; transition: opacity .5s; -webkit-tap-highlight-color: transparent; }
#msplash.out { opacity: 0; pointer-events: none; }
#msplash canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
#msplash .ms-brand { position: absolute; left: 0; right: 0; top: calc(9cqh + env(safe-area-inset-top, 0px)); text-align: center; }
#msplash .ms-name { font-weight: 800; font-size: min(7.4cqw, 34px); letter-spacing: -.02em; line-height: 1; }
#msplash .ms-han { font-size: min(3.6cqw, 16px); letter-spacing: .6em; padding-left: .6em; margin-top: 1.2cqh; opacity: .6; }
#msplash .migo { position: absolute; left: 50%; top: 40cqh; width: min(30cqw, 150px); aspect-ratio: 540 / 560; height: auto; overflow: visible; translate: -50% -50%; animation: ms-bob 2.4s ease-in-out infinite; }
@keyframes ms-bob { 50% { transform: translateY(-4%) rotate(-3deg); } }
#msplash .migo .eye { transform-box: view-box; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#msplash .migo .eye.l { transform-origin: 190px 428px; } #msplash .migo .eye.r { transform-origin: 383px 418px; }
#msplash .migo .closed { opacity: 0; }
#msplash .migo.blink .closed { opacity: 1; }
#msplash .migo .mouth { transform-box: view-box; transform-origin: 297px 496px; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#msplash .migo .wow-marks { opacity: 0; transform-box: view-box; transform-origin: 560px 160px; transform: scale(.4); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.8, .5, 1); }
/* удивление: глаза округляются и смотрят вверх, рот «о», рядом «!» */
#msplash .migo[data-mood="wow"] .eye { transform: translateY(-7px) scale(1.22); }
#msplash .migo[data-mood="wow"] .mouth { transform: scale(1.6, 2.6); }
#msplash .migo[data-mood="wow"] .wow-marks { opacity: 1; transform: none; }
#msplash .migo[data-mood="wow"] .all { animation: ms-jolt .45s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes ms-jolt { 30% { transform: translateY(-9%) scale(.96, 1.06); } 60% { transform: translateY(0) scale(1.04, .96); } }
#msplash .ms-status { position: absolute; left: 0; right: 0; bottom: calc(7cqh + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: min(3.6cqw, 16px); font-weight: 600; opacity: .6; transition: opacity .3s; }
#msplash .ms-bar { position: absolute; left: 50%; bottom: calc(4.6cqh + env(safe-area-inset-bottom, 0px)); width: min(26cqw, 120px); height: 3px; translate: -50% 0; border-radius: 3px; overflow: hidden; background: var(--h-surface-2, #F1EEE9); transition: opacity .3s; }
#msplash .ms-bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: var(--h-fg, #111); }
#msplash.done .ms-status, #msplash.done .ms-bar { opacity: 0; }
#msplash .ms-greet { position: absolute; left: 6cqw; right: 6cqw; top: 66cqh; text-align: center; opacity: 0; transform: translateY(2.5cqh); transition: opacity .7s .35s, transform .7s .35s; }
#msplash.done .ms-greet { opacity: 1; transform: none; }
#msplash .ms-hi { font-size: min(4.6cqw, 20px); font-weight: 600; opacity: .6; }
#msplash .ms-who { font-size: min(10cqw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin-top: .6cqh; overflow-wrap: anywhere; }
#msplash .ms-day { font-size: min(3.6cqw, 16px); margin-top: 1.6cqh; opacity: .6; }
#msplash .ms-pill { position: absolute; left: 50%; bottom: calc(6cqh + env(safe-area-inset-bottom, 0px)); translate: -50% 0; white-space: nowrap; font-size: min(3.6cqw, 16px); font-weight: 600; padding: .65em 1.3em; border-radius: 999px; background: var(--h-surface-2, #F1EEE9); opacity: 0; transition: opacity .6s .7s; }
#msplash.done .ms-pill:not(:empty) { opacity: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #msplash .migo { filter: invert(1); } }
:root[data-theme="dark"] #msplash .migo { filter: invert(1); }
@media (prefers-reduced-motion: reduce) {
  #msplash .migo, #msplash .migo[data-mood="wow"] .all { animation: none; }
  #msplash .migo .eye, #msplash .migo .mouth, #msplash .migo .wow-marks { transition: none; }
}
</style>

<script>
const MingyueSplash = (() => {
  const root = document.getElementById("msplash");
  if (!root) return { finish: () => Promise.resolve(), hide() {} };
  const $ = s => root.querySelector(s);
  const cv = $("canvas"), migo = $(".migo"), statusEl = $(".ms-status"), bar = $(".ms-bar i");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LINES = ["Просыпаюсь…", "Собираю задачи…", "Раскладываю день…"];
  const ENTRY = 1.3, MIN_BEFORE_BURST = 2.2, BURST = 1.1, HOLD = 2.4;

  // Фигурки: место на орбите, размер, с какой стороны залетают
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const STARS = Array.from({ length: 13 }, (_, i) => ({
    off: i / 13 * Math.PI * 2 + (rnd() - .5) * .25,
    size: i % 3 === 0 ? 1 : i % 3 === 1 ? .6 : .4,
    side: i % 2 ? 1 : -1, fromY: rnd(), delay: rnd() * .45, tw: rnd() * 6,
    sparks: Array.from({ length: 7 }, (_, k) => ({ a: k / 7 * Math.PI * 2 + rnd() * .6, v: .6 + rnd() * .7, star: k % 3 === 0 }))
  }));

  // Орбита: круг с волной сверху, поэтому фигурки идут зигзагом
  const pos = (t, cx, cy, R) => { const r = R * (1 + .13 * Math.sin(6 * t)); return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const easeOut = k => 1 - (1 - k) ** 3;
  const clamp = k => Math.max(0, Math.min(1, k));

  const h = new Date().getHours();
  const slot = h >= 5 && h < 12 ? 8 : h >= 12 && h < 17 ? 14 : h >= 17 && h < 23 ? 20 : 2;
  const HELLO = { 8: "Доброе утро", 14: "Добрый день", 20: "Добрый вечер", 2: "Доброй ночи" };

  // Что кружит по орбите в разное время суток
  const KIND = { 8: "sun", 14: "flower", 20: "star", 2: "moon" };
  let kind = "star";
  const kindOf = st => kind === "moon" && st.size < .5 ? "star" : kind;
  function shape(x, k, cx, cy, r, rot, bg) {
    if (k === "star") return star(x, cx, cy, r, rot);
    x.save(); x.translate(cx, cy); x.rotate(rot);
    if (k === "sun") {
      x.beginPath(); x.arc(0, 0, r * .42, 0, Math.PI * 2); x.fill();
      x.lineWidth = Math.max(1, r * .16); x.lineCap = "round"; x.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.moveTo(Math.cos(a) * r * .62, Math.sin(a) * r * .62); x.lineTo(Math.cos(a) * r * .95, Math.sin(a) * r * .95); }
      x.stroke();
    } else if (k === "flower") {
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; x.beginPath(); x.ellipse(Math.cos(a) * r * .5, Math.sin(a) * r * .5, r * .42, r * .3, a, 0, Math.PI * 2); x.fill(); }
      x.fillStyle = bg; x.beginPath(); x.arc(0, 0, r * .24, 0, Math.PI * 2); x.fill();
    } else if (k === "moon") {
      // месяц: круг, из которого вырезан сдвинутый круг
      x.beginPath(); x.arc(0, 0, r * .75, 0, Math.PI * 2); x.fill(); x.clip();
      x.fillStyle = bg; x.beginPath(); x.arc(r * .4, -r * .24, r * .62, 0, Math.PI * 2); x.fill();
    }
    x.restore();
  }
  // Четырёхлучевая звёздочка
  function star(x, cx, cy, r, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2, b = a + Math.PI / 4;
      x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      x.quadraticCurveTo(Math.cos(b) * r * .14, Math.sin(b) * r * .14, Math.cos(a + Math.PI / 2) * r, Math.sin(a + Math.PI / 2) * r);
    }
    x.fill(); x.restore();
  }
  kind = KIND[slot];

  let t0 = performance.now(), phase = 0, last = 0, raf = 0, burstAt = null, line = -1, done = false, resolveHidden, calm, blinkTimer;
  const hidden = new Promise(r => resolveHidden = r);

  function frame(now) {
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    phase += dt * (still ? .25 : .9);
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  function draw(el) {
    const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    const cs = getComputedStyle(root), ink = cs.color, bg = cs.backgroundColor;
    x.fillStyle = ink; x.strokeStyle = ink;
    const unit = Math.min(w, 460), cx = w / 2, cy = h * .40, R = unit * .34, base = unit * .055;
    const b = burstAt == null ? -1 : el - burstAt;

    const orbitA = clamp(el / ENTRY) * (b > 0 ? clamp(1 - b / .3) : 1);
    if (orbitA > 0) {
      x.save(); x.globalAlpha = .14 * orbitA; x.setLineDash([1.5, 5]); x.lineWidth = 1.2; x.beginPath();
      for (let i = 0; i <= 160; i++) { const [px, py] = pos(i / 160 * Math.PI * 2, cx, cy, R); i ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.stroke(); x.restore();
    }

    for (const st of STARS) {
      const [ox, oy] = pos(phase + st.off, cx, cy, R);
      const r = base * st.size * (1 + .18 * Math.sin(el * 3 + st.tw));
      if (b < 0) {
        // залёт с края экрана по дуге
        const e = easeOut(clamp((el - st.delay) / (ENTRY - .3)));
        if (e <= 0) continue;
        const sx = st.side < 0 ? -base * 2 : w + base * 2, sy = h * (.15 + st.fromY * .7);
        const mx = (sx + ox) / 2, my = Math.min(sy, oy) - h * .12;
        const q = 1 - e, px = q * q * sx + 2 * q * e * mx + e * e * ox, py = q * q * sy + 2 * q * e * my + e * e * oy;
        if (e < 1) { x.save(); x.globalAlpha = .25 * (1 - e); x.lineWidth = r * .5; x.lineCap = "round"; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (sx - px) * .18, py + (sy - py) * .18); x.stroke(); x.restore(); }
        shape(x, kindOf(st), px, py, r, el * .8 * st.side, bg);
      } else if (b < BURST) {
        // взрыв: фигурка вспыхивает и разлетается искрами
        const p = b / BURST, flash = clamp(1 - p * 4);
        if (flash > 0) shape(x, kindOf(st), ox, oy, r * (1 + 1.6 * (1 - flash)), 0, bg);
        x.save(); x.globalAlpha = 1 - p;
        const dist = easeOut(p) * unit * .16;
        for (const sp of st.sparks) {
          const a = sp.a + Math.atan2(oy - cy, ox - cx) * .3, d = dist * sp.v;
          const px = ox + Math.cos(a) * d, py = oy + Math.sin(a) * d;
          if (sp.star) shape(x, kindOf(st), px, py, r * .45 * (1 - p * .5), p * 3, bg);
          else { x.beginPath(); x.arc(px, py, Math.max(.6, r * .14 * (1 - p)), 0, Math.PI * 2); x.fill(); }
        }
        x.restore();
      }
    }

    if (b >= 0 && !done) {
      done = true; root.classList.add("done");
      clearTimeout(calm); migo.dataset.mood = "wow";
      calm = setTimeout(() => { migo.dataset.mood = "idle"; blink(); }, 1700);
      setTimeout(hide, (BURST * .4 + HOLD) * 1000);
    }
    // полоска: пока ждём данные, ползёт к 90%, после finish дозаполняется
    const k = burstAt == null ? .9 * (1 - Math.exp(-el / 1.6)) : 1;
    bar.style.transform = `scaleX(${k.toFixed(3)})`;
    const li = Math.min(LINES.length - 1, Math.floor(el / 1.1));
    if (li !== line && !done) { line = li; statusEl.textContent = LINES[li]; }
  }

  function blink() { migo.classList.add("blink"); setTimeout(() => migo.classList.remove("blink"), 130); }
  if (!still) (function loop() { blinkTimer = setTimeout(() => { if (migo.dataset.mood === "idle") blink(); loop(); }, 2200 + Math.random() * 3000); })();

  function finish({ name, summary } = {}) {
    if (burstAt != null) return hidden;
    $(".ms-hi").textContent = name ? HELLO[slot] + "," : "";
    $(".ms-who").textContent = name || HELLO[slot] + "!";
    $(".ms-day").textContent = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    $(".ms-pill").textContent = summary || "";
    const el = (performance.now() - t0) / 1000;
    burstAt = Math.max(el, MIN_BEFORE_BURST);
    return hidden;
  }

  function hide() {
    if (root.classList.contains("out")) return;
    root.classList.add("out");
    setTimeout(() => { cancelAnimationFrame(raf); clearTimeout(blinkTimer); clearTimeout(calm); root.remove(); resolveHidden(); }, 520);
  }

  // тап пропускает только приветствие, не загрузку
  root.addEventListener("click", () => { if (done) hide(); });
  raf = requestAnimationFrame(frame);
  return { finish, hide };
})();

<script>

const Hiro = (() => {
  const svg = document.getElementById("hiro");
  const eyes = svg.querySelectorAll(".eye");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const NEAR = 260; // px from his face: closer than this, the eyes follow the mouse
  const MX = 9, MY = 5; // how far the eyes travel inside the glasses, in drawing units
  let base = "idle", timer = 0, following = false;
  // look(x, y) with x, y in -1..1
  const look = (x, y) => eyes.forEach(e => { e.style.transform = `translate(${(x * MX).toFixed(1)}px, ${(y * MY).toFixed(1)}px)`; });
  const SPOTS = [[.9, -.6], [-.9, -.2], [.9, .3], [0, -.9], [-.7, .7], [.7, .7], [0, 0], [-.8, -.7], [.3, -.9]];
  (function wander() {
    setTimeout(() => {
      if (!following && !still && svg.isConnected && svg.dataset.mood !== "sleep") look(...SPOTS[Math.floor(Math.random() * SPOTS.length)]);
      wander();
    }, 1400 + Math.random() * 2600);
  })();
  (function blink() {
    setTimeout(() => {
      if (!still && svg.dataset.mood !== "sleep") {
        svg.classList.add("blink");
        setTimeout(() => svg.classList.remove("blink"), 130);
        if (Math.random() < .2) setTimeout(() => { svg.classList.add("blink"); setTimeout(() => svg.classList.remove("blink"), 120); }, 280);
      }
      blink();
    }, 2000 + Math.random() * 4000);
  })();
  // now and then he mumbles
  setInterval(() => {
    if (!still && svg.dataset.mood === "idle" && Math.random() < .3) { svg.classList.remove("talk"); void svg.getBoundingClientRect(); svg.classList.add("talk"); }
  }, 3500);
  if (fine && !still) addEventListener("pointermove", e => {
    if (!svg.isConnected) return;
    const r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .75;
    const dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy);
    if (d < NEAR) {
      following = true;
      const k = Math.min(1, d / 90);
      look(dx / (d || 1) * k, dy / (d || 1) * k);
      if (svg.dataset.mood === "sleep" && d < 90) mood("wow", 900);
    } else following = false;
  }, { passive: true });
  function mood(m, ms) {
    clearTimeout(timer);
    svg.dataset.mood = m;
    if (ms) timer = setTimeout(() => { svg.dataset.mood = base; }, ms); else base = m;
  }
  svg.addEventListener("click", () => mood("happy", 1000));
  return { mood };
})();
const HiroDragon = (() => {
  // the drawing slithers along a circle with a wave on top: zigzag around the ring
  const box = document.getElementById("hdragon"), img = box.querySelector("img");

const DOW = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

/* quick add: "купить хлеб завтра 18:00 !" */

  rx(/\s!+(?=\s)/g, () => { prio = true; });
  rx(/\s(?:в\s([01]?\d|2[0-3])[:.]([0-5]\d)|([01]?\d|2[0-3]):([0-5]\d))(?=\s)/i, (_, h1, m1, h2, m2) => { time = `${(h1 || h2).padStart(2, "0")}:${m1 || m2}`; });
  rx(/\sпослезавтра(?=\s)/i, () => { date = ymd(addDays(now, 2)); });
  rx(/\sзавтра(?=\s)/i, () => { date = ymd(addDays(now, 1)); });
  rx(/\sсегодня(?=\s)/i, () => { date = ymd(now); });
  rx(/\s(?:в[о]?\s)?(пн|вт|ср|чт|пт|сб|вс)(?=\s)/i, (_, d) => {
    const want = DOW.indexOf(d.toLowerCase()); let diff = (want - dowIdx(now) + 7) % 7; if (diff === 0) diff = 7;
