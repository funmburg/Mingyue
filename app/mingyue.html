<!-- loading screen (design/splash/splash-embed.html), shown on every start until the planner data is ready -->
<style>
#msplash { position: fixed; inset: 0; z-index: 9999; background: var(--h-surface, #fff); color: var(--h-fg, #111); font-family: var(--h-f-body, "Manrope", system-ui, sans-serif); container-type: size; overflow: hidden; transition: opacity .5s; -webkit-tap-highlight-color: transparent; }
#msplash.out { opacity: 0; pointer-events: none; }
#msplash canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
#msplash .ms-brand { position: absolute; left: 0; right: 0; top: calc(9cqh + env(safe-area-inset-top, 0px)); text-align: center; }
#msplash .ms-name { font-weight: 800; font-size: min(7.4cqw, 34px); letter-spacing: -.02em; line-height: 1; }
#msplash .ms-han { font-size: min(3.6cqw, 16px); letter-spacing: .6em; padding-left: .6em; margin-top: 1.2cqh; opacity: .6; }
#msplash .migo { position: absolute; left: 50%; top: 40cqh; width: min(30cqw, 150px); aspect-ratio: 540 / 560; height: auto; overflow: visible; translate: -50% -50%; animation: ms-bob 2.4s ease-in-out infinite; }
@keyframes ms-bob { 50% { transform: translateY(-4%) rotate(-3deg); } }
#msplash .migo .eye { transform-box: view-box; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#msplash .migo .eye.l { transform-origin: 190px 428px; } #msplash .migo .eye.r { transform-origin: 383px 418px; }
#msplash .migo .closed { opacity: 0; }
#msplash .migo.blink .closed { opacity: 1; }
#msplash .migo .mouth { transform-box: view-box; transform-origin: 297px 496px; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#msplash .migo .wow-marks { opacity: 0; transform-box: view-box; transform-origin: 560px 160px; transform: scale(.4); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.8, .5, 1); }
/* удивление: глаза округляются и смотрят вверх, рот «о», рядом «!» */
#msplash .migo[data-mood="wow"] .eye { transform: translateY(-7px) scale(1.22); }
#msplash .migo[data-mood="wow"] .mouth { transform: scale(1.6, 2.6); }
#msplash .migo[data-mood="wow"] .wow-marks { opacity: 1; transform: none; }
#msplash .migo[data-mood="wow"] .all { animation: ms-jolt .45s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes ms-jolt { 30% { transform: translateY(-9%) scale(.96, 1.06); } 60% { transform: translateY(0) scale(1.04, .96); } }
#msplash .ms-status { position: absolute; left: 0; right: 0; bottom: calc(7cqh + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: min(3.6cqw, 16px); font-weight: 600; opacity: .6; transition: opacity .3s; }
#msplash .ms-bar { display: none; position: absolute; left: 50%; bottom: calc(4.6cqh + env(safe-area-inset-bottom, 0px)); width: min(26cqw, 120px); height: 3px; translate: -50% 0; border-radius: 3px; overflow: hidden; background: var(--h-surface-2, #F1EEE9); transition: opacity .3s; }
#msplash .ms-bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: var(--h-fg, #111); }
#msplash.done .ms-status, #msplash.done .ms-bar { opacity: 0; }
#msplash .ms-greet { position: absolute; left: 6cqw; right: 6cqw; top: 66cqh; text-align: center; opacity: 0; transform: translateY(2.5cqh); transition: opacity .7s .35s, transform .7s .35s; }
#msplash.done .ms-greet { opacity: 1; transform: none; }
#msplash .ms-hi { font-size: min(4.6cqw, 20px); font-weight: 600; opacity: .6; }
#msplash .ms-who { font-size: min(10cqw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin-top: .6cqh; overflow-wrap: anywhere; }
#msplash .ms-day { font-size: min(3.6cqw, 16px); margin-top: 1.6cqh; opacity: .6; }
#msplash .ms-pill { position: absolute; left: 50%; bottom: calc(6cqh + env(safe-area-inset-bottom, 0px)); translate: -50% 0; white-space: nowrap; font-size: min(3.6cqw, 16px); font-weight: 600; padding: .65em 1.3em; border-radius: 999px; background: var(--h-surface-2, #F1EEE9); opacity: 0; transition: opacity .6s .7s; }
#msplash.done .ms-pill:not(:empty) { opacity: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #msplash .migo { filter: invert(1); } }
:root[data-theme="dark"] #msplash .migo { filter: invert(1); }
@media (prefers-reduced-motion: reduce) {
  #msplash .migo, #msplash .migo[data-mood="wow"] .all { animation: none; }
  #msplash .migo .eye, #msplash .migo .mouth, #msplash .migo .wow-marks { transition: none; }
}
</style>

<script>
const MingyueSplash = (() => {
  const root = document.getElementById("msplash");
  if (!root) return { finish: () => Promise.resolve(), hide() {} };
  const $ = s => root.querySelector(s);
  const cv = $("canvas"), migo = $(".migo"), statusEl = $(".ms-status"), bar = $(".ms-bar i");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EN_UI = (() => { try { const p = JSON.parse(localStorage.getItem("mingyue.prefs") || "{}"); if (p.lang) return p.lang === "en"; } catch {} return !/^(ru|uk|be|kk)/i.test(navigator.language || "ru"); })();
  const LINES = EN_UI ? ["Waking up…", "Gathering tasks…", "Laying out the day…"] : ["Просыпаюсь…", "Собираю задачи…", "Раскладываю день…"];
  const ENTRY = 1.3, MIN_BEFORE_BURST = 2.2, BURST = 1.1, HOLD = 2.4;

  // Фигурки: место на орбите, размер, с какой стороны залетают
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const STARS = Array.from({ length: 13 }, (_, i) => ({
    off: i / 13 * Math.PI * 2 + (rnd() - .5) * .25,
    size: i % 3 === 0 ? 1 : i % 3 === 1 ? .6 : .4,
    side: i % 2 ? 1 : -1, fromY: rnd(), delay: rnd() * .45, tw: rnd() * 6,
    sparks: Array.from({ length: 7 }, (_, k) => ({ a: k / 7 * Math.PI * 2 + rnd() * .6, v: .6 + rnd() * .7, star: k % 3 === 0 }))
  }));

  // Орбита: круг с волной сверху, поэтому фигурки идут зигзагом
  const pos = (t, cx, cy, R) => { const r = R * (1 + .13 * Math.sin(6 * t)); return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const easeOut = k => 1 - (1 - k) ** 3;
  const clamp = k => Math.max(0, Math.min(1, k));

  const h = new Date().getHours();
  const slot = h >= 5 && h < 12 ? 8 : h >= 12 && h < 17 ? 14 : h >= 17 && h < 23 ? 20 : 2;
  const HELLO = EN_UI ? { 8: "Good morning", 14: "Good afternoon", 20: "Good evening", 2: "Good night" } : { 8: "Доброе утро", 14: "Добрый день", 20: "Добрый вечер", 2: "Доброй ночи" };

  // Что кружит по орбите в разное время суток
  const KIND = { 8: "sun", 14: "flower", 20: "star", 2: "moon" };
  let kind = "star";
  const kindOf = st => kind === "moon" && st.size < .5 ? "star" : kind;
  function shape(x, k, cx, cy, r, rot, bg) {
    if (k === "star") return star(x, cx, cy, r, rot);
    x.save(); x.translate(cx, cy); x.rotate(rot);
    if (k === "sun") {
      x.beginPath(); x.arc(0, 0, r * .42, 0, Math.PI * 2); x.fill();
      x.lineWidth = Math.max(1, r * .16); x.lineCap = "round"; x.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.moveTo(Math.cos(a) * r * .62, Math.sin(a) * r * .62); x.lineTo(Math.cos(a) * r * .95, Math.sin(a) * r * .95); }
      x.stroke();
    } else if (k === "flower") {
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; x.beginPath(); x.ellipse(Math.cos(a) * r * .5, Math.sin(a) * r * .5, r * .42, r * .3, a, 0, Math.PI * 2); x.fill(); }
      x.fillStyle = bg; x.beginPath(); x.arc(0, 0, r * .24, 0, Math.PI * 2); x.fill();
    } else if (k === "moon") {
      // месяц: круг, из которого вырезан сдвинутый круг
      x.beginPath(); x.arc(0, 0, r * .75, 0, Math.PI * 2); x.fill(); x.clip();
      x.fillStyle = bg; x.beginPath(); x.arc(r * .4, -r * .24, r * .62, 0, Math.PI * 2); x.fill();
    }
    x.restore();
  }
  // Четырёхлучевая звёздочка
  function star(x, cx, cy, r, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2, b = a + Math.PI / 4;
      x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      x.quadraticCurveTo(Math.cos(b) * r * .14, Math.sin(b) * r * .14, Math.cos(a + Math.PI / 2) * r, Math.sin(a + Math.PI / 2) * r);
    }
    x.fill(); x.restore();
  }
  kind = KIND[slot];

  let t0 = performance.now(), phase = 0, last = 0, raf = 0, burstAt = null, line = -1, done = false, resolveHidden, calm, blinkTimer;
  const hidden = new Promise(r => resolveHidden = r);

  function frame(now) {
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    phase += dt * (still ? .25 : .9);
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  function draw(el) {
    const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    const cs = getComputedStyle(root), ink = cs.color, bg = cs.backgroundColor;
    x.fillStyle = ink; x.strokeStyle = ink;
    const unit = Math.min(w, 460), cx = w / 2, cy = h * .40, R = unit * .34, base = unit * .055;
    const b = burstAt == null ? -1 : el - burstAt;

    const orbitA = clamp(el / ENTRY) * (b > 0 ? clamp(1 - b / .3) : 1);
    if (orbitA > 0) {
      x.save(); x.globalAlpha = .14 * orbitA; x.setLineDash([1.5, 5]); x.lineWidth = 1.2; x.beginPath();
      for (let i = 0; i <= 160; i++) { const [px, py] = pos(i / 160 * Math.PI * 2, cx, cy, R); i ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.stroke(); x.restore();
    }

    for (const st of STARS) {
      const [ox, oy] = pos(phase + st.off, cx, cy, R);
      const r = base * st.size * (1 + .18 * Math.sin(el * 3 + st.tw));
      if (b < 0) {
        // залёт с края экрана по дуге
        const e = easeOut(clamp((el - st.delay) / (ENTRY - .3)));
        if (e <= 0) continue;
        const sx = st.side < 0 ? -base * 2 : w + base * 2, sy = h * (.15 + st.fromY * .7);
        const mx = (sx + ox) / 2, my = Math.min(sy, oy) - h * .12;
        const q = 1 - e, px = q * q * sx + 2 * q * e * mx + e * e * ox, py = q * q * sy + 2 * q * e * my + e * e * oy;
        if (e < 1) { x.save(); x.globalAlpha = .25 * (1 - e); x.lineWidth = r * .5; x.lineCap = "round"; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (sx - px) * .18, py + (sy - py) * .18); x.stroke(); x.restore(); }
        shape(x, kindOf(st), px, py, r, el * .8 * st.side, bg);
      } else if (b < BURST) {
        // взрыв: фигурка вспыхивает и разлетается искрами
        const p = b / BURST, flash = clamp(1 - p * 4);
        if (flash > 0) shape(x, kindOf(st), ox, oy, r * (1 + 1.6 * (1 - flash)), 0, bg);
        x.save(); x.globalAlpha = 1 - p;
        const dist = easeOut(p) * unit * .16;
        for (const sp of st.sparks) {
          const a = sp.a + Math.atan2(oy - cy, ox - cx) * .3, d = dist * sp.v;
          const px = ox + Math.cos(a) * d, py = oy + Math.sin(a) * d;
          if (sp.star) shape(x, kindOf(st), px, py, r * .45 * (1 - p * .5), p * 3, bg);
          else { x.beginPath(); x.arc(px, py, Math.max(.6, r * .14 * (1 - p)), 0, Math.PI * 2); x.fill(); }
        }
        x.restore();
      }
    }

    if (b >= 0 && !done) {
      done = true; root.classList.add("done");
      clearTimeout(calm); migo.dataset.mood = "wow";
      calm = setTimeout(() => { migo.dataset.mood = "idle"; blink(); }, 1700);
      setTimeout(hide, (BURST * .4 + HOLD) * 1000);
    }
    // полоска: пока ждём данные, ползёт к 90%, после finish дозаполняется
    const k = burstAt == null ? .9 * (1 - Math.exp(-el / 1.6)) : 1;
    bar.style.transform = `scaleX(${k.toFixed(3)})`;
    const li = Math.min(LINES.length - 1, Math.floor(el / 1.1));
    if (li !== line && !done) { line = li; statusEl.textContent = LINES[li]; }
  }

  function blink() { migo.classList.add("blink"); setTimeout(() => migo.classList.remove("blink"), 130); }
  if (!still) (function loop() { blinkTimer = setTimeout(() => { if (migo.dataset.mood === "idle") blink(); loop(); }, 2200 + Math.random() * 3000); })();

  function finish({ name, summary } = {}) {
    if (burstAt != null) return hidden;
    $(".ms-hi").textContent = name ? HELLO[slot] + "," : "";
    $(".ms-who").textContent = name || HELLO[slot] + "!";
    $(".ms-day").textContent = new Date().toLocaleDateString(EN_UI ? "en-GB" : "ru-RU", { weekday: "long", day: "numeric", month: "long" });
    $(".ms-pill").textContent = summary || "";
    const el = (performance.now() - t0) / 1000;
    burstAt = Math.max(el, MIN_BEFORE_BURST);
    return hidden;
  }

  function hide() {
    if (root.classList.contains("out")) return;
    root.classList.add("out");
    setTimeout(() => { cancelAnimationFrame(raf); clearTimeout(blinkTimer); clearTimeout(calm); root.remove(); resolveHidden(); }, 520);
  }

  // тап пропускает только приветствие, не загрузку
  root.addEventListener("click", () => { if (done) hide(); });
  raf = requestAnimationFrame(frame);
  return { finish, hide };
})();

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(.hdragon img, img.mascot) { filter: invert(1); } }
:root[data-theme="dark"] :is(.hdragon img, img.mascot) { filter: invert(1); }
.hiro-slot { flex: none; }
@media (max-width: 899px) { .head:has(.hiro-slot) { flex-wrap: nowrap; align-items: flex-start; } .hiro-slot .hiro { width: 96px; height: 100px; } }
.loading { display: grid; place-items: center; gap: 12px; padding-block: 18vh; color: var(--h-muted); }
#parking { display: none; }

/* minimal component overrides (design thread) */
.head h1 { font-weight: 800; letter-spacing: -.03em; }
.side { border-right-color: transparent; }
.list { border: 0; border-radius: 0; background: transparent; }
.task { padding-inline: 0; }
.add { box-shadow: none; border-width: 0 0 1.5px; border-radius: 0; border-color: var(--h-fg); padding: 6px 0; background: transparent; }
.chip { border: 0; background: transparent; padding: 0; }
.chip.time { background: transparent; color: var(--h-fg); }
.chk { border-radius: 6px; }
.hchip { border-color: var(--h-fg); }
.btn { border-color: var(--h-fg); background: transparent; }

/* ---------- mobile branch: touch layer (phone only) ---------- */
.hchip svg { width: 14px; height: 14px; flex: none; }
@media (max-width: 899px) {
  input, textarea { font-size: 16px; } /* iOS zooms into anything smaller */
  .day .mini { font-size: 16px; }
  .hint { display: none; }
  .side { background: var(--h-bg); }
  .nav a { min-height: 48px; justify-content: center; }
  .btn { min-height: 40px; }
  .x { padding: 10px; }
  /* 44px hit area around small controls without changing how they look */
  .chk { position: relative; }
  .chk::after { content: ""; position: absolute; inset: -11px; }
  /* week: one day per screen, swipe sideways */
  .week { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 86%; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 4px; scroll-padding-inline: 16px; }
  .week::-webkit-scrollbar { display: none; }
  .day { scroll-snap-align: start; min-height: 40vh; }
  .day .task { min-height: 48px; font-size: 15px; }
  .weekdots { display: flex; justify-content: center; gap: 6px; margin-top: -12px; }
  .weekdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--h-muted); opacity: .35; }
  .weekdots i.on { opacity: 1; }
  .weekdots i.on { background: var(--h-fg); }
  /* habits: name on top, the 7 days across the full width below */
  .habit { grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
  .habit > :first-child { grid-area: 1 / 1; }
  .habit > .x { grid-area: 1 / 2; }
  .habit > .dots { grid-area: 2 / 1 / 3 / 3; justify-content: space-between; }
  .dots .dot { width: auto; height: auto; flex: 1; max-width: 42px; aspect-ratio: 1; font-size: 12px; }
  .dayheads { display: none; }
  /* edit sheet: docked to the bottom, drag down to close */
  .scrim { padding: 0; }
  .sheet { width: 100%; border-radius: 20px 20px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); touch-action: none; }
  .sheet::before { content: ""; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--h-line); }
  .sheet input, .sheet button { touch-action: manipulation; }
}
@media (max-width: 899px) and (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheet-up .22s ease-out; }
  @keyframes sheet-up { from { transform: translateY(100%); } }
}
/* swipe on a task row: right = done, left = move to tomorrow */
.task.swipable { position: relative; touch-action: pan-y; }
.task.swiping { transform: translateX(var(--dx, 0)); }
.task.swiping::before { position: absolute; top: 0; bottom: 0; width: 140px; display: flex; align-items: center; font: 600 13px var(--h-f-body); color: var(--h-muted); border-radius: 8px; }
.task.swiping.r::before { content: var(--t-done, "Готово"); right: calc(100% + 8px); justify-content: flex-end; padding-right: 10px; }
.task.swiping.l::before { content: var(--t-tomorrow, "На завтра"); left: calc(100% + 8px); justify-content: flex-start; padding-left: 10px; }
.task.swiping.armed::before { background: var(--h-mark); color: var(--h-mark-fg); }
.task.settle { transition: transform .18s ease-out; }
.day > div { overflow: hidden; }

/* ---------- mobile branch: look from the reference (warm canvas, white cards, floating pill nav) ---------- */
@media (max-width: 899px) {
  :root { --p-bg: var(--h-bg); --p-card: var(--h-surface); --p-soft: var(--h-surface-2); --p-line: var(--h-line); --p-danger-soft: var(--h-danger-soft); --p-danger-fg: var(--h-danger-fg); }
  body { background: var(--p-bg); }
  .side { left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px; border: 0; border-radius: 999px; background: var(--p-card); box-shadow: 0 8px 28px rgb(0 0 0 / .10); }
  .nav { gap: 4px; }
  .nav a { flex: 0 1 auto; min-width: 52px; min-height: 48px; padding: 0 14px; border-radius: 999px; font-size: 0; gap: 8px; flex-direction: row; color: var(--h-fg); }
  .nav a svg { width: 22px; height: 22px; }
  .nav a[aria-current="page"] { flex: 1 0 auto; background: var(--h-mark); color: var(--h-mark-fg); font-size: 14px; font-weight: 600; }
  .nav a:hover { background: transparent; }
  .nav a[aria-current="page"]:hover { background: var(--h-mark); }
  main { padding-block: 16px 120px; }
  .wrap { gap: 18px; }
  .head h1 { font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
  .list, .nlist, .editor, .day { background: var(--p-card); border: 0; border-radius: 20px; }
  .list { padding: 0 14px; }
  .task { border-top-color: var(--p-line); }
  .add { background: var(--p-card); border: 0; border-radius: 999px; padding: 6px 6px 6px 12px; }
  .add button { border-radius: 999px; }
  .hchip { background: var(--p-card); border-color: transparent; }
  .hchip[aria-pressed="true"] { background: var(--h-mark); border-color: var(--h-mark); }
  .btn { background: var(--p-card); border-color: transparent; border-radius: 999px; }
  .btn.primary { background: var(--h-mark); color: var(--h-mark-fg); }
  .day header { border-bottom-color: var(--p-line); }
  .day.today header { border-radius: 20px 20px 0 0; }
  .day .mini { border-top-color: var(--p-line); border-radius: 0 0 20px 20px; }
  .sheet { background: var(--p-card); }
  .sheet input[type="text"], .sheet input[type="date"], .sheet input[type="time"] { background: var(--p-soft); border-color: transparent; }

  /* today on phone: day strip + timeline */
  .ph-head { display: flex; align-items: center; gap: 10px; }
  .ph-head > .mascot { width: 40px; height: 41px; }
  .ph-head .ttl { flex: 1; min-width: 0; }
  .ph-head h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(24px, 8vw, 32px); }
  .ph-head .sub { margin-top: 2px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .ph-head .sub i { width: 6px; height: 6px; border-radius: 50%; background: var(--h-muted); flex: none; }
  .ph-head .sub i[data-mode="sync"] { background: var(--h-ok); }
  .ph-acts { display: flex; gap: 8px; align-items: center; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--p-card); font-weight: 600; font-size: 14px; }
  .pill svg { width: 16px; height: 16px; }
  .pill input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .fab { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--h-mark); color: var(--h-mark-fg); display: grid; place-items: center; padding: 0; }
  .fab svg { width: 20px; height: 20px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .strip::-webkit-scrollbar { display: none; }
  .sday { flex: 1 0 46px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 9px; border: 0; border-radius: 999px; background: var(--p-card); color: var(--h-fg); }
  .sday small { font-size: 12px; color: var(--h-muted); }
  .sday b { font: 600 19px/1.1 var(--h-f-body); font-variant-numeric: tabular-nums; }
  .sday .pips { display: flex; gap: 3px; height: 5px; }
  .sday .pips i { width: 4px; height: 4px; border-radius: 50%; background: var(--h-fg); }
  .sday.sel { background: var(--h-mark); color: var(--h-mark-fg); }
  .sday.sel small { color: inherit; opacity: .7; }
  .sday.sel .pips i { background: var(--h-mark-fg); }
  .sday.past:not(.sel) { opacity: .6; }
  .tline { display: flex; flex-direction: column; gap: 10px; }
  .tl { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: start; overflow: hidden; }
  .tl-time { padding-top: 14px; font-variant-numeric: tabular-nums; }
  .tl-time b { display: block; font: 600 16px/1.1 var(--h-f-body); }
  .tl-time span { font-size: 12px; color: var(--h-muted); }
  .card.task { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; min-height: 64px; padding: 12px 14px; border: 0; border-radius: 20px; background: var(--p-card); }
  .card .chk { width: 26px; height: 26px; }
  .card .t { font-weight: 600; }
  .card .badges { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--p-soft); color: var(--h-fg); }
  .badge.dark { background: var(--h-mark); color: var(--h-mark-fg); }
  .badge.late { background: var(--p-danger-soft); color: var(--p-danger-fg); }
  .badge.bdot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .6; }
  .slot { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border: 1.5px dashed color-mix(in srgb, var(--h-muted) 55%, transparent); border-radius: 20px; background: transparent; color: var(--h-muted); font-weight: 500; text-align: left; }
  .slot svg { width: 16px; height: 16px; }
  .tline .blank { background: var(--p-card); border-radius: 20px; }
  .tline .blank .hiro { width: 110px; height: 114px; }
}

/* ---------- mobile branch: avatar tab + settings ---------- */
.avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: #D9D4CB; color: #111111; font: 700 14px var(--h-f-body); box-shadow: 0 0 0 2px var(--h-surface), 0 0 0 3.5px var(--h-fg); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.nav a.me-tab { padding-block: 6px; }
@media (max-width: 899px) { .nav { gap: 2px; } .nav a { min-width: 44px; padding: 0 10px; } .nav a.me-tab { padding: 0 8px; } .nav a.me-tab[aria-current="page"] { padding: 0 7px; } .nav a.me-tab .lbl { display: none; } }
.set-group { display: flex; flex-direction: column; gap: 8px; }
.set-group > h2 { margin: 0; font: 600 13px var(--h-f-body); color: var(--h-muted); padding-left: 4px; }
.set-card { background: var(--h-surface); border-radius: var(--h-r); padding: 0 16px; }

.set-row:first-child { border-top: 0; }

.set-row .lbl small { display: block; color: var(--h-muted); font-size: 12px; }
.set-row .soon { font-size: 12px; color: var(--h-muted); }
.profile { display: flex; align-items: center; gap: 14px; padding: 16px; }
.profile .avatar { width: 56px; height: 56px; font-size: 22px; }
.profile b { display: block; font-size: 17px; }
.profile .pinfo { flex: 1; min-width: 0; }
.build { margin: 4px 0 0; text-align: center; font: 500 11px var(--h-f-mono); color: var(--h-muted); }
.profile .pname { display: block; width: 100%; border: 0; border-bottom: 1.5px dashed var(--h-line); border-radius: 0; background: transparent; padding: 2px 0 3px; margin-bottom: 4px; font-size: 17px; font-weight: 700; color: var(--h-fg); outline: none; }
.profile .pname:focus { border-bottom-color: var(--h-fg); }
.profile .pname::placeholder { color: var(--h-muted); font-weight: 600; }
.profile small { display: flex; align-items: center; gap: 6px; color: var(--h-muted); font-size: 13px; }
.profile small i { width: 6px; height: 6px; border-radius: 50%; background: var(--h-muted); }
.profile small i[data-mode="sync"] { background: var(--h-ok); }
.seg { display: flex; background: var(--h-surface-2); border-radius: var(--h-r-pill, 999px); padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--h-muted); }
.seg button[aria-pressed="true"] { background: var(--h-mark); color: var(--h-mark-fg); }
.tgl { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; flex: none; border-radius: 999px; background: var(--h-line); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--h-surface); box-shadow: 0 1px 3px rgb(0 0 0 / .2); transition: transform .15s; }
.tgl:checked { background: var(--h-mark); }
.tgl:checked::after { transform: translateX(18px); }
.tgl:disabled { opacity: .45; }
.set-row button.link { border: 0; background: transparent; padding: 0; font-weight: 600; text-align: left; flex: 1; min-height: 56px; }
html.calm-eyes .hiro .eye { transform: none !important; }
html.no-sleep .hiro[data-mood="sleep"] :is(.closed, .zz) { opacity: 0; animation: none; }
html.no-sleep .hiro[data-mood="sleep"] :is(.all, .zz text) { animation: none; }

/* ---------- Google Calendar events: a thin bar instead of a checkbox ---------- */
.task.ev .evbar { width: 3px; align-self: stretch; min-height: 18px; flex: none; border-radius: 2px; background: var(--h-fg); opacity: .55; margin-inline: 9px 10px; }
.task.ev .t { color: var(--h-muted); text-decoration: none; justify-self: start; text-align: left; }
.card.task.ev .evbar { margin: 0 0 0 11px; min-height: 26px; }
.card.task.ev .t { font-weight: 600; }
.task.ev a.t:hover { color: var(--h-fg); }
.day .task.ev .evbar { margin-inline: 7px 0; }
.task.ev .evt { font: 500 12px var(--h-f-mono); color: var(--h-fg); }
.pips i.ev { background: transparent !important; box-shadow: inset 0 0 0 1px var(--h-fg); }
.sday.sel .pips i.ev { box-shadow: inset 0 0 0 1px var(--h-mark-fg); }
.gerr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px dashed var(--h-muted); border-radius: 12px; font-size: 13px; color: var(--h-muted); }
.gerr .btn { flex: none; }
.btn.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--h-fg); }
.btn.gbtn svg { width: 16px; height: 16px; }

/* ---------- mobile branch: calendar (month / year) ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; }
.cal-head h1 { flex: 1; min-width: 0; margin: 0; font: 600 clamp(24px, 8vw, 30px)/1.1 var(--h-f-body); letter-spacing: -.02em; }

.cal-bar { display: flex; justify-content: space-between; align-items: center; }
.month { background: var(--h-surface); border-radius: var(--h-r); padding: 12px 8px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; }

.year { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.ygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
.ygrid i { font-style: normal; text-align: center; font-size: 10px; line-height: 18px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.ygrid i.has { font-weight: 800; }
.ygrid i.today { background: var(--h-mark); color: var(--h-mark-fg); }

/* every tab's title sits on the same line: 41px row (Migo's height), top-aligned */
@media (max-width: 899px) {
  .head, .ph-head, .cal-head { align-items: flex-start; }
  .head h1, .ph-head h1, .cal-head h1 { margin: 0; font-size: clamp(24px, 8vw, 32px); line-height: 41px; }

}

/* ---------- mobile branch: animated tab switch ---------- */
@media (max-width: 899px) {
.nav { position: relative; justify-content: space-between; }
.nav a, .nav a[aria-current="page"] { position: relative; z-index: 1; flex: 0 0 auto; font-size: 14px; gap: 0; background: transparent; transition: color .25s; }
.nav a[aria-current="page"], .nav a[aria-current="page"]:hover { background: transparent; color: var(--h-mark-fg); }
.nav a .lbl { display: inline-block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .32s cubic-bezier(.3, .7, .2, 1), opacity .2s, margin .32s cubic-bezier(.3, .7, .2, 1); }
.nav a[aria-current="page"] .lbl { max-width: 110px; opacity: 1; margin-left: 8px; }
.nav-ind { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 999px; background: var(--h-mark); pointer-events: none; }
}
@media (min-width: 900px) { .nav-ind { display: none; } .nav a.me-tab .avatar { width: 24px; height: 24px; font-size: 11px; } }
/* the slide-in from the right must not widen the page, or Android shifts the fixed tab bar */
@media (max-width: 899px) { html, body, main { overflow-x: clip; } }
@keyframes page-in-r { from { opacity: 0; transform: translateX(28px); } }
@keyframes page-in-l { from { opacity: 0; transform: translateX(-28px); } }
main.in-r > * { animation: page-in-r .3s cubic-bezier(.3, .7, .2, 1); }
main.in-l > * { animation: page-in-l .3s cubic-bezier(.3, .7, .2, 1); }
@media (prefers-reduced-motion: reduce) { .nav a .lbl { transition: none; } main.in-r > *, main.in-l > * { animation: none; } }

/* ---------- mobile branch: animated switches ---------- */
.seg { position: relative; }
.seg button { position: relative; z-index: 1; transition: color .25s; }
.seg button[aria-pressed="true"] { background: transparent; color: var(--h-mark-fg); }
.seg-ind { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--h-mark); transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
.tgl { transition: background .25s; }
.tgl::after { transition: transform .32s cubic-bezier(.3, 1.45, .5, 1), width .15s; }
.tgl:active::after { width: 27px; }
.tgl:checked:active::after { transform: translateX(13px); }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
@media (prefers-reduced-motion: reduce) { .seg-ind, .tgl, .tgl::after { transition: none; } }
/* ---------- Migo tab ---------- */
.nav a .mg-navico { width: 26px; height: 26px; flex: none; border-radius: 50%; overflow: hidden; position: relative; background: var(--h-surface-2); }
.nav a .mg-navico img { position: absolute; width: 44px; left: -9px; top: -4px; }
@media (max-width: 899px) { .nav a { min-width: 40px; padding: 0 8px; } }
.mg-wrap { gap: 12px; }
.mg-hero { --safe: env(safe-area-inset-top, 0px); position: relative; height: 410px; display: flex; flex-direction: column; justify-content: space-between; }
.mg-titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px 4px 0; }
.mg-titlerow small { display: block; font-size: 13px; font-weight: 600; color: var(--h-muted); }

<script>

const Hiro = (() => {
  const svg = document.getElementById("hiro");
  const eyes = svg.querySelectorAll(".eye");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const NEAR = 260; // px from his face: closer than this, the eyes follow the mouse
  const MX = 9, MY = 5; // how far the eyes travel inside the glasses, in drawing units
  let base = "idle", timer = 0, following = false;
  // look(x, y) with x, y in -1..1
  const look = (x, y) => eyes.forEach(e => { e.style.transform = `translate(${(x * MX).toFixed(1)}px, ${(y * MY).toFixed(1)}px)`; });
  const SPOTS = [[.9, -.6], [-.9, -.2], [.9, .3], [0, -.9], [-.7, .7], [.7, .7], [0, 0], [-.8, -.7], [.3, -.9]];
  (function wander() {
    setTimeout(() => {
      if (!following && !still && svg.isConnected && svg.dataset.mood !== "sleep") look(...SPOTS[Math.floor(Math.random() * SPOTS.length)]);
      wander();
    }, 1400 + Math.random() * 2600);
  })();
  (function blink() {
    setTimeout(() => {
      if (!still && svg.dataset.mood !== "sleep") {
        svg.classList.add("blink");
        setTimeout(() => svg.classList.remove("blink"), 130);
        if (Math.random() < .2) setTimeout(() => { svg.classList.add("blink"); setTimeout(() => svg.classList.remove("blink"), 120); }, 280);
      }
      blink();
    }, 2000 + Math.random() * 4000);
  })();
  // now and then he mumbles
  setInterval(() => {
    if (!still && svg.dataset.mood === "idle" && Math.random() < .3) { svg.classList.remove("talk"); void svg.getBoundingClientRect(); svg.classList.add("talk"); }
  }, 3500);
  if (fine && !still) addEventListener("pointermove", e => {
    if (!svg.isConnected) return;
    const r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .75;
    const dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy);
    if (d < NEAR) {
      following = true;
      const k = Math.min(1, d / 90);
      look(dx / (d || 1) * k, dy / (d || 1) * k);
      if (svg.dataset.mood === "sleep" && d < 90) mood("wow", 900);
    } else following = false;
  }, { passive: true });
  function mood(m, ms) {
    clearTimeout(timer);
    svg.dataset.mood = m;
    if (ms) timer = setTimeout(() => { svg.dataset.mood = base; }, ms); else base = m;
  }
  svg.addEventListener("click", () => mood("happy", 1000));
  return { mood };
})();
const HiroDragon = (() => {
  // the drawing slithers along a circle with a wave on top: zigzag around the ring
  const box = document.getElementById("hdragon"), img = box.querySelector("img");

/* quick add: "купить хлеб завтра 18:00 !" */
function parseQuick(text, baseDate) {
  let title = " " + text.trim() + " ", date = baseDate ?? null, time = null, prio = false;
  const now = new Date();
  const rx = (re, fn) => { title = title.replace(re, (...m) => { fn(...m); return " "; }); };
  rx(/\s!+(?=\s)/g, () => { prio = true; });
  rx(/\s(?:(?:в|at)\s([01]?\d|2[0-3])[:.]([0-5]\d)|([01]?\d|2[0-3]):([0-5]\d))(?=\s)/i, (_, h1, m1, h2, m2) => { time = `${(h1 || h2).padStart(2, "0")}:${m1 || m2}`; });
  rx(/\sпослезавтра(?=\s)/i, () => { date = ymd(addDays(now, 2)); });
  rx(/\s(?:завтра|tomorrow)(?=\s)/i, () => { date = ymd(addDays(now, 1)); });
  rx(/\s(?:сегодня|today)(?=\s)/i, () => { date = ymd(now); });
  rx(/\s(?:в[о]?\s)?(пн|вт|ср|чт|пт|сб|вс)(?=\s)/i, (_, d) => {
    const want = DOW_RU.indexOf(d.toLowerCase()); let diff = (want - dowIdx(now) + 7) % 7; if (diff === 0) diff = 7;
    date = ymd(addDays(now, diff));
  });
  rx(/\s(?:on\s)?(mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i, (_, d) => {
    const want = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"].indexOf(d.toLowerCase()); let diff = (want - dowIdx(now) + 7) % 7; if (diff === 0) diff = 7;
    date = ymd(addDays(now, diff));
  });
  rx(/\s(\d{1,2})\.(\d{1,2})(?=\s)/, (_, dd, mm) => {
    let d = new Date(now.getFullYear(), +mm - 1, +dd); if (ymd(d) < ymd(now)) d = new Date(now.getFullYear() + 1, +mm - 1, +dd);
    date = ymd(d);
  });
  title = title.replace(/\s+/g, " ").trim();
  if (time && !date) date = ymd(now);
  return { title, date, time, prio };
}

async function ntApi(path, method = "GET", data, token) {

        headers: { Authorization: "Bearer " + (token || ntCfg()?.token), "Notion-Version": "2022-06-28", "Content-Type": "application/json" } });
    } catch { throw Object.assign(new Error(tr("Нет связи с Notion")), { net: true }); }

/* note text <-> Notion blocks: first line is the title, then one block per line; "- ", "[ ] ", "# ", "> ", "1. " keep their meaning */
const ntRT = s => { const out = []; for (let i = 0; i < s.length; i += 2000) out.push({ type: "text", text: { content: s.slice(i, i + 2000) } }); return out; };

function ntBlock(line) {

  if ((m = /^(#{1,3}) (.*)$/.exec(line))) { type = "heading_" + m[1].length; line = m[2]; }
  else if ((m = /^\[([ xX])\] (.*)$/.exec(line))) { type = "to_do"; extra.checked = m[1] !== " "; line = m[2]; }
  else if ((m = /^[-•*] (.*)$/.exec(line))) { type = "bulleted_list_item"; line = m[1]; }
  else if ((m = /^\d+[.)] (.*)$/.exec(line))) { type = "numbered_list_item"; line = m[1]; }
  else if ((m = /^> (.*)$/.exec(line))) { type = "quote"; line = m[1]; }

}
function ntLine(b) {
  const v = b[b.type], t = ntPlain(v?.rich_text);
  switch (b.type) {
    case "paragraph": return t;
    case "heading_1": return "# " + t;
    case "heading_2": return "## " + t;
    case "heading_3": return "### " + t;
    case "to_do": return (v.checked ? "[x] " : "[ ] ") + t;
    case "bulleted_list_item": return "- " + t;
    case "numbered_list_item": return "1. " + t;
    case "quote": return "> " + t;

}
function ntSplit(body) {
  const lines = ntStrip(body).split("\n"), i = lines.findIndex(l => l.trim());
  const title = i < 0 ? "" : lines[i].replace(/^#{1,3} /, "").trim(), rest = i < 0 ? [] : lines.slice(i + 1);
  while (rest.length && !rest[rest.length - 1].trim()) rest.pop();

}
async function ntChildren(pid) {
  const out = []; let cur = "";

    const j = await ntApi(`blocks/${pid}/children?page_size=100${cur ? "&start_cursor=" + cur : ""}`);
    out.push(...(j.results || [])); cur = j.has_more ? j.next_cursor : "";

}
async function ntAppend(pid, blocks) { for (let i = 0; i < blocks.length; i += 100) await ntApi(`blocks/${pid}/children`, "PATCH", { children: blocks.slice(i, i + 100) }); }
/* send a note: new page, or the title and all blocks replaced */
async function ntPush(n, c) {
  const body = n.body || "", { title, blocks } = ntSplit(body);
  let pid = n.nt?.pid;
  if (pid) {
    await ntApi("pages/" + pid, "PATCH", { properties: { [c.tprop]: { title: ntRT(title) } } });
    for (const b of await ntChildren(pid)) await ntApi("blocks/" + b.id, "DELETE");
    await ntAppend(pid, blocks);
  } else {
    const p = await ntApi("pages", "POST", { parent: { database_id: c.db },
      properties: { [c.tprop]: { title: ntRT(title) }, [c.tags]: { multi_select: [{ name: c.tag }] } }, children: blocks.slice(0, 100) });
    pid = ntId(p.id); await ntAppend(pid, blocks.slice(100));
  }
  const p = await ntApi("pages/" + pid), cur = S.notes[n.id];
  if (!cur) return ntGone(pid, "archive"); // deleted while it was being sent
  put("notes", { ...cur, nt: { pid, et: p.last_edited_time, h: nid(body), url: p.url || "" } });
}
/* take a page into a note; a page with pictures, tables or nested blocks is read-only here, so they don't get lost */
async function ntPull(p, n, c) {
  let ro = false; const lines = [];
  for (const b of await ntChildren(p.id)) { const l = ntLine(b); if (l === null || b.has_children) ro = true; if (l !== null) lines.push(l); }
  const body = [ntPlain(p.properties?.[c.tprop]?.title) || tr("Без названия"), ...lines].join("\n").replace(/\n+$/, "");
  const nt = { pid: ntId(p.id), et: p.last_edited_time, h: nid(body), url: p.url || "", ro };
  put("notes", n ? { ...S.notes[n.id], body, nt, updatedAt: Date.parse(p.last_edited_time) }
    : { id: uid(), body, nt, updatedAt: Date.parse(p.last_edited_time), createdAt: Date.parse(p.created_time) });
}
/* a note deleted or switched off here: the page goes to Notion's trash, or just loses the tag */
function ntGone(pid, what) {
  if (NT.quiet || !ntCfg()) return;
  const g = fbRead(NT.gone) || {}; g[pid] = what; fbWrite(NT.gone, g); ntSoon();
}
function ntSoon(ms = 3000) { if (!ntCfg()) return; clearTimeout(NT.timer); NT.timer = setTimeout(() => ntSync().catch(() => {}), ms); }
async function ntRun(c) {
  for (const [pid, what] of Object.entries(fbRead(NT.gone) || {})) {
    try {
      if (what === "archive") await ntApi("pages/" + pid, "PATCH", { archived: true });

        await ntApi("pages/" + pid, "PATCH", { properties: { [c.tags]: { multi_select: keep.map(o => ({ name: o.name })) } } });
      }
    } catch (e) { if (e.net || e.status === 401 || e.status === 429 || e.status >= 500) throw e; } // gone already or no access: nothing to do

  const pages = []; let cur = null;
  do {
    const j = await ntApi(`databases/${c.db}/query`, "POST", { filter: { property: c.tags, multi_select: { contains: c.tag } }, page_size: 100, ...(cur ? { start_cursor: cur } : {}) });

  for (const n of Object.values(S.notes)) if (n.nt?.pid) local[n.nt.pid] = n;
  const editing = document.activeElement?.id === "note-body" ? openNote : null;
  for (const [pid, p] of Object.entries(remote)) {
    const n = local[pid] && S.notes[local[pid].id];
    const theirs = !n || p.last_edited_time !== n.nt.et, mine = n && nid(n.body || "") !== n.nt.h;
    // both sides changed: the later edit wins
    if (theirs && (!mine || Date.parse(p.last_edited_time) >= n.updatedAt)) { if (!n || n.id !== editing) await ntPull(p, n, c); }
    else if (mine && !n.nt.ro) await ntPush(n, c);

  for (const [pid, n0] of Object.entries(local)) {
    const n = S.notes[n0.id]; if (remote[pid] || !n?.nt) continue;
    let p = null; try { p = await ntApi("pages/" + pid); } catch (e) { if (e.net || e.status === 401 || e.status >= 500) throw e; }
    const unlink = () => put("notes", { ...n, nt: null, body: ntStrip(n.body) });
    // deleted in Notion: delete here too, unless it was edited here since; untagged or no access: keep it, unlinked
    if (p && (p.archived || p.in_trash) && nid(n.body || "") === n.nt.h) { NT.quiet = true; del("notes", n.id); NT.quiet = false; }
    else unlink();
  }
  for (const n of Object.values(S.notes)) if (!n.nt?.pid && ntOn(n) && (n.body || "").trim() && S.notes[n.id]) await ntPush(n, c);
}
async function ntSync() {
  const c = ntCfg(); if (!c || !ready) return;
  if (NT.busy) { NT.again = true; return NT.busy; }
  NT.busy = (async () => {
    try { await ntRun(c); NT.at = Date.now(); NT.err = ""; }
    catch (e) { NT.err = e?.status === 401 ? tr("Notion не принял токен, подключите заново") : e?.status === 404 ? tr("Нет доступа к базе Notion: откройте её для интеграции") : e?.message || "error"; }
    finally { NT.busy = null; if (view() === "settings") render(); if (NT.again) { NT.again = false; ntSoon(1500); } }
  })();
  return NT.busy;
}
/* connect: a database link, a page link (a database is made inside it), or nothing (whatever was shared with the integration) */
async function ntConnect(token, link, tag) {
  tag = tag.replace(/^#/, "").trim() || "notion";
  if (!/^[\p{L}\p{N}_-]+$/u.test(tag)) throw new Error(tr("В теге только буквы, цифры, - и _"));
  if (!/^(ntn_|secret_)/.test(token)) throw new Error(tr("Токен начинается с ntn_ или secret_"));
  const ids = (link.split("?")[0].match(/[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi) || []).map(ntId);
  const api = (p, m, d) => ntApi(p, m, d, token);

  if (parent) db = await getDb(parent);

    const s = await api("search", "POST", { page_size: 50 });
    const dbs = (s.results || []).filter(r => r.object === "database"), pages = (s.results || []).filter(r => r.object === "page" && r.parent?.type !== "database_id");
    db = dbs.find(d => /mingyue/i.test(ntPlain(d.title))) || (dbs.length === 1 ? dbs[0] : null);
    if (!db && dbs.length > 1) throw new Error(tr("Интеграции открыто несколько баз, вставьте ссылку на нужную"));

    if (!db && !parent) throw new Error(tr("Интеграции не открыта ни одна страница. В Notion: ⋯ → Подключения → Mingyue"));
  }
  if (!db) {
    try {
      db = await api("databases", "POST", { parent: { type: "page_id", page_id: parent }, is_inline: true, title: ntRT(tr("Заметки Mingyue")),
        properties: { [tr("Название")]: { title: {} }, [tr("Теги")]: { multi_select: { options: [{ name: tag }] } } } });
    } catch (e) { if (e.status === 404 || e.status === 400) throw new Error(tr("Нет доступа к странице. В Notion: ⋯ → Подключения → Mingyue")); throw e; }
  }
  const props = Object.entries(db.properties || {});
  const tprop = props.find(([, v]) => v.type === "title")?.[0];
  let tags = (props.find(([k, v]) => v.type === "multi_select" && /^(теги|тег|метки|tags?|labels?)$/i.test(k)) || props.find(([, v]) => v.type === "multi_select"))?.[0];
  if (!tags) { tags = tr("Теги"); await api("databases/" + ntId(db.id), "PATCH", { properties: { [tags]: { multi_select: {} } } }); }

}
function ntDisconnect() {
  fbWrite(NT.ls, null); fbWrite(NT.gone, null); NT.err = ""; NT.at = 0;

  render();
}
function ntStatus() {
  const c = ntCfg();
  if (!NHTTP) return tr("Работает в приложении для Android");
  if (!c) return tr("Заметки с тегом синхронизируются с базой Notion");
  if (NT.err) return NT.err;
  if (NT.busy && !NT.at) return tr("Синхронизирую…");
  const n = Object.values(S.notes).filter(x => x.nt?.pid).length;
  return `«${c.name}» · #${c.tag} · ${n} ${pl(n, "заметка", "заметки", "заметок", "note", "notes")}` + (NT.at ? " · " + new Date(NT.at).toLocaleTimeString(LOC, { hour: "2-digit", minute: "2-digit" }) : "");
}
function ntSheet() {

  const token = inp("nt-token", "ntn_…", c.token), link = inp("nt-link", tr("необязательно"), c.url), tag = inp("nt-tag", "notion", c.tag);

    go.disabled = true; go.textContent = tr("Подключаю…");
    try { await ntConnect(token.value.trim(), link.value.trim(), tag.value); close(); toast(tr("Notion подключён")); render(); }
    catch (e) { go.disabled = false; go.textContent = tr("Подключить"); toast(e?.message?.slice(0, 160) || tr("Не получилось подключить Notion")); }
  } }, tr("Подключить"));

    h("div", { class: "sheet", role: "dialog", "aria-label": "Notion" },

      h("small", { class: "nthelp" }, tr("1. notion.so/profile/integrations → Новая интеграция «Mingyue», скопируйте токен. 2. В Notion на нужной странице или базе: ⋯ → Подключения → Mingyue.")),
      h("label", {}, tr("Токен интеграции"), token),
      h("label", {}, tr("Ссылка на базу или страницу"), link),
      h("label", {}, tr("Тег"), tag),
      h("small", { class: "nthelp" }, tr("В Notion уходят заметки с #тегом в тексте, из Notion приходят страницы базы с этим тегом.")),
      h("div", { class: "acts" }, ntCfg() ? h("button", { class: "btn danger", onclick: () => { close(); ntDisconnect(); } }, tr("Отключить")) : h("span"),
        h("div", { style: "display:flex;gap:8px" }, h("button", { class: "btn", onclick: close }, tr("Отмена")), go))));

/* editor bar: put a note into Notion or take it out */
function ntNoteBtn(n) {

if (NHTTP) {
